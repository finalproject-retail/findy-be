server:
  port: 8889

spring:
  application:
    name: user-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      connect-timeout: 3s

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA:user_service}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:user_service}
    default-schema: ${DB_SCHEMA:user_service}
    create-schemas: true
    table: flyway_schema_history
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:user_service}
        format_sql: true

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration_time: 3600000 # 1시간 (밀리초 단위)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
