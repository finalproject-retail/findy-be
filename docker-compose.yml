name: findy-be

x-database-env: &database-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-findy}
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"

# Compose 내부 서비스 → kafka:9092 / 호스트·IDE → localhost:9094 (EXTERNAL 리스너)
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  postgres:
    image: postgres:16-alpine
    container_name: findy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-findy}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-findy}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - findy-network

  redis:
    image: redis:7-alpine
    container_name: findy-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - findy-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: findy-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - findy-network

  apigateway:
    build:
      context: ./apigateway
    container_name: findy-apigateway
    restart: unless-stopped
    ports:
      - "${APIGATEWAY_PORT:-8080}:8080"
    environment:
      <<: [ *database-env, *redis-env ]
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8080}
      SHOPPING_SERVICE_URL: ${SHOPPING_SERVICE_URL:-http://shopping-service:8080}
      MAP_SERVICE_URL: ${MAP_SERVICE_URL:-http://map-service:8080}
      RECOMMENDATION_SERVICE_URL: ${RECOMMENDATION_SERVICE_URL:-http://recommendation-service:8080}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      shopping-service:
        condition: service_started
      map-service:
        condition: service_started
      recommendation-service:
        condition: service_started
      analytics-service:
        condition: service_started
    networks:
      - findy-network

  prometheus:
    image: prom/prometheus:latest
    container_name: findy-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - findy-network

  grafana:
    image: grafana/grafana:latest
    container_name: findy-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - findy-network

  user-service:
    build:
      context: ./user-service
    container_name: findy-user-service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT:-8889}:8080"
    environment:
      <<: [ *database-env, *redis-env ]
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      SERVER_PORT: 8080
      SHOPPING_SERVICE_URL: http://shopping-service:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/oauth/google/callback}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:3000/oauth/kakao/callback}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@findy.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - findy-network

  shopping-service:
    build:
      context: ./shopping-service
    container_name: findy-shopping-service
    restart: unless-stopped
    ports:
      - "${SHOPPING_SERVICE_PORT:-8887}:8080"
    environment:
      <<: [ *database-env, *kafka-env ]
      SERVER_PORT: 8080
      SHOPPING_KAFKA_ENABLED: "true"
      SHOPPING_KAFKA_TOPIC: shopping.analytics.events
      SHOPPING_KAFKA_DEFAULT_STORE_ID: "1"
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      MFDS_API_KEY: ${MFDS_API_KEY:-}
      HACCP_SERVICE_KEY: ${HACCP_SERVICE_KEY:-}
      KCA_PRODUCT_PRICE_SERVICE_KEY: ${KCA_PRODUCT_PRICE_SERVICE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - findy-network

  recommendation-service:
    build:
      context: ./recommendation-service
    container_name: findy-recommendation-service
    restart: unless-stopped
    ports:
      - "${RECOMMENDATION_SERVICE_PORT:-8886}:8080"
    environment:
      <<: *database-env
      SERVER_PORT: 8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-test}
      SHOPPING_SERVICE_URL: http://shopping-service:8080
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      shopping-service:
        condition: service_started
    networks:
      - findy-network

  map-service:
    build:
      context: ./map-service
    container_name: findy-map-service
    restart: unless-stopped
    ports:
      - "${MAP_SERVICE_PORT:-8888}:8080"
    environment:
      <<: *database-env
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      SERVER_PORT: 8080
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - findy-network

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: findy-analytics-service
    restart: unless-stopped
    ports:
      - "${ANALYTICS_SERVICE_PORT:-8885}:8080"
    environment:
      <<: [ *database-env, *kafka-env ]
      SERVER_PORT: 8080
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - findy-network

volumes:
  postgres_data:
  grafana-data:

networks:
  findy-network:
    driver: bridge
