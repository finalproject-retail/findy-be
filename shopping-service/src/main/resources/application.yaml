server:
  address: 0.0.0.0
  port: 8887

spring:
  application:
    name: shopping-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:findy}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

naver:
  shopping:
    base-url: https://openapi.naver.com
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

mfds:
  barcode:
    base-url: https://openapi.foodsafetykorea.go.kr/api
    key-id: ${MFDS_API_KEY}
    service-id: I2570
    data-type: json
  linked-product:
    base-url: https://openapi.foodsafetykorea.go.kr/api
    key-id: ${MFDS_API_KEY}
    service-id: C005
    data-type: json

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always