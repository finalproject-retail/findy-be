server:
  port: 8886

spring:
  application:
    name: recommendation-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:findy}?currentSchema=${DB_SCHEMA:recommendation_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:recommendation_service}
    default-schema: ${DB_SCHEMA:recommendation_service}
    create-schemas: true
    table: flyway_schema_history
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:recommendation_service}
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

openai:
  base-url: https://api.openai.com
  api-key: ${OPENAI_API_KEY}
  embedding-model: text-embedding-3-small
  embedding-dimensions: 512
  chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

ai:
  provider: ${AI_PROVIDER:openai}

external:
  shopping:
    base-url: ${SHOPPING_SERVICE_URL:http://localhost:8887}

bedrock:
  region: ${AWS_REGION:ap-northeast-2}
  chat-model-id: ${BEDROCK_CHAT_MODEL_ID:anthropic.claude-3-haiku-20240307-v1:0}
  embedding-model-id: ${BEDROCK_EMBEDDING_MODEL_ID:amazon.titan-embed-text-v2:0}
  embedding-dimensions: ${BEDROCK_EMBEDDING_DIMENSIONS:512}
  max-tokens: ${BEDROCK_MAX_TOKENS:1200}
  temperature: ${BEDROCK_TEMPERATURE:0.0}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

recommendation:
  embedding:
    startup-sync-enabled: true
    startup-sync-limit: 100
    scheduled-sync-enabled: false
    cron: "0 0 3 * * *"
    sync-limit: 100

  promotion:
    score:
      embedding-weight: 0.70
      promotion-benefit-weight: 0.15
      stock-weight: 0.05
      promotion-type-weight: 0.05
      location-weight: 0.05
      fallback-base-score: 0.30
      fallback-benefit-weight: 0.35
      fallback-stock-weight: 0.15
      fallback-promotion-type-weight: 0.15
      fallback-location-weight: 0.05
      near-grid-distance: 2
      displayable-grid-distance: 5

  auto-sync:
    enabled: ${PRODUCT_EMBEDDING_AUTO_SYNC_ENABLED:true}
    batch-size: ${PRODUCT_EMBEDDING_AUTO_SYNC_BATCH_SIZE:50}
    initial-delay-ms: ${PRODUCT_EMBEDDING_AUTO_SYNC_INITIAL_DELAY_MS:30000}
    fixed-delay-ms: ${PRODUCT_EMBEDDING_AUTO_SYNC_FIXED_DELAY_MS:900000}