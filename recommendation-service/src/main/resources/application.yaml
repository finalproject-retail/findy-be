server:
  port: 8886

spring:
  application:
    name: recommendation-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:findy}?currentSchema=${DB_SCHEMA:recommendation_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:recommendation_service}
    default-schema: ${DB_SCHEMA:recommendation_service}
    create-schemas: true
    table: flyway_schema_history
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:recommendation_service}
        format_sql: true

openai:
  base-url: https://api.openai.com
  api-key: ${OPENAI_API_KEY}
  embedding-model: text-embedding-3-small
  embedding-dimensions: 512

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

recommendation:
  promotion:
    score:
      embedding-weight: 0.70
      promotion-benefit-weight: 0.15
      stock-weight: 0.05
      promotion-type-weight: 0.05
      location-weight: 0.05
      fallback-base-score: 0.30
      fallback-benefit-weight: 0.35
      fallback-stock-weight: 0.15
      fallback-promotion-type-weight: 0.15
      fallback-location-weight: 0.05
      near-grid-distance: 2
      displayable-grid-distance: 5