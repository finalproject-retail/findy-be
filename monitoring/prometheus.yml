global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "findy-services"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "apigateway:8080"
          - "user-service:8080"
          - "shopping-service:8080"
          - "map-service:8080"