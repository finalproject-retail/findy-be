server:
  port: 8888


spring:
  application:
    name: map-service

  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA:map_service}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:map_service}
    default-schema: ${DB_SCHEMA:map_service}
    create-schemas: true
    table: flyway_schema_history
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:map_service}
        format_sql: true

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration_time: 3600000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

