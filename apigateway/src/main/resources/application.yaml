server:
  port: 8080

spring:
  application:
    name: apigateway

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

services:
  shopping:
    base-url: ${SHOPPING_SERVICE_URL:http://localhost:8887}
