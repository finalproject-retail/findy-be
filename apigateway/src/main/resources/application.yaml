server:
  port: 8080

spring:
  application:
    name: apigateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:8081"
              - "http://localhost:19006"
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            exposed-headers:
              - Authorization
              - X-USER-ID
            allow-credentials: true
            max-age: 3600

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,https://d3fdsv269tc0ul.cloudfront.net}

jwt:
  secret: ${JWT_SECRET_KEY}

services:
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8889}
  shopping:
    base-url: ${SHOPPING_SERVICE_URL:http://localhost:8887}
  map:
    base-url: ${MAP_SERVICE_URL:http://localhost:8888}
  recommendation:
    base-url: ${RECOMMENDATION_SERVICE_URL:http://localhost:8886}
  analytics:
    base-url: ${ANALYTICS_SERVICE_URL:http://localhost:8885}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
