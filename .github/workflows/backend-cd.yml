name: Backend CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "414901227428"
  AWS_ROLE_ARN: arn:aws:iam::414901227428:role/findy-github-actions-backend-cd-role
  EKS_CLUSTER_NAME: findy-eks
  K8S_NAMESPACE: findy

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: apigateway
            path: apigateway
            ecr_repository: findy-apigateway-ecr
          - service: user-service
            path: user-service
            ecr_repository: findy-user-service-ecr
          - service: shopping-service
            path: shopping-service
            ecr_repository: findy-shopping-service-ecr

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: findy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d findy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: findy
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_KEY: ci-test-jwt-secret-key-for-findy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: ${{ matrix.path }}
        run: chmod +x ./gradlew

      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: ./gradlew test --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.ecr_repository }}:${{ github.sha }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.ecr_repository }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      DB_HOST: ${{ vars.DB_HOST || 'postgres' }}
      DB_PORT: ${{ vars.DB_PORT || '5432' }}
      DB_NAME: ${{ vars.DB_NAME || 'findy' }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      REDIS_HOST: ${{ vars.REDIS_HOST || 'redis' }}
      REDIS_PORT: ${{ vars.REDIS_PORT || '6379' }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || 'http://localhost:3000' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Validate deployment secrets
        run: |
          test -n "$DB_USERNAME"
          test -n "$DB_PASSWORD"
          test -n "$JWT_SECRET_KEY"

      - name: Apply runtime config
        run: |
          kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap findy-app-config \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=SERVER_PORT=8080 \
            --from-literal=DB_HOST="$DB_HOST" \
            --from-literal=DB_PORT="$DB_PORT" \
            --from-literal=DB_NAME="$DB_NAME" \
            --from-literal=REDIS_HOST="$REDIS_HOST" \
            --from-literal=REDIS_PORT="$REDIS_PORT" \
            --from-literal=CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic findy-app-secret \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update backend images
        run: |
          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          kubectl set image deployment/apigateway apigateway="$ECR_REGISTRY/findy-apigateway-ecr:$GITHUB_SHA" -n "$K8S_NAMESPACE"
          kubectl set image deployment/user-service user-service="$ECR_REGISTRY/findy-user-service-ecr:$GITHUB_SHA" -n "$K8S_NAMESPACE"
          kubectl set image deployment/shopping-service shopping-service="$ECR_REGISTRY/findy-shopping-service-ecr:$GITHUB_SHA" -n "$K8S_NAMESPACE"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/apigateway -n "$K8S_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/user-service -n "$K8S_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/shopping-service -n "$K8S_NAMESPACE" --timeout=180s
