name: Backend CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: "414901227428"
  AWS_REGION: ap-northeast-2
  IMAGE_TAG: ${{ github.sha }}
  INFRA_REPOSITORY: finalproject-retail/findy-infra
  INFRA_BRANCH: dev

jobs:
  detect-changed-services:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      test_services: ${{ steps.detect.outputs.test_services }}
      deploy_services: ${{ steps.detect.outputs.deploy_services }}

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed backend services
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            run_all=true
          else
            run_all=false

            if [[ "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 "${HEAD_SHA}")"
            fi
          fi

          if [[ "${run_all}" == "true" ]]; then
            changed_files=()
          else
            mapfile -t changed_files < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          fi

          all_test_services="$(jq -cn '[
            {"service":"apigateway","path":"apigateway"},
            {"service":"user-service","path":"user-service"},
            {"service":"map-service","path":"map-service"},
            {"service":"recommendation-service","path":"recommendation-service"},
            {"service":"shopping-service","path":"shopping-service"},
            {"service":"analytics-service","path":"analytics-service"}
          ]')"

          all_deploy_services="$(jq -cn '[
            {"service":"apigateway","path":"apigateway","ecr_repository":"findy-apigateway-ecr"},
            {"service":"user-service","path":"user-service","ecr_repository":"findy-user-service-ecr"},
            {"service":"map-service","path":"map-service","ecr_repository":"findy-map-service-ecr"},
            {"service":"recommendation-service","path":"recommendation-service","ecr_repository":"findy-recommendation-service-ecr"},
            {"service":"shopping-service","path":"shopping-service","ecr_repository":"findy-shopping-service-ecr"},
            {"service":"analytics-service","path":"analytics-service","ecr_repository":"findy-analytics-service-ecr"}
          ]')"

          declare -A changed_services=()

          for file in "${changed_files[@]}"; do
            case "${file}" in
              .github/workflows/backend-cd.yml|docker-compose.yml)
                run_all=true
                ;;
              apigateway/*)
                changed_services["apigateway"]=1
                ;;
              user-service/*)
                changed_services["user-service"]=1
                ;;
              map-service/*)
                changed_services["map-service"]=1
                ;;
              recommendation-service/*)
                changed_services["recommendation-service"]=1
                ;;
              shopping-service/*)
                changed_services["shopping-service"]=1
                ;;
              analytics-service/*)
                changed_services["analytics-service"]=1
                ;;
            esac
          done

          if [[ "${run_all}" == "true" ]]; then
            test_services="${all_test_services}"
            deploy_services="${all_deploy_services}"
          else
            test_services="$(jq -cn \
              --arg apigateway "${changed_services[apigateway]+yes}" \
              --arg user_service "${changed_services[user-service]+yes}" \
              --arg map_service "${changed_services[map-service]+yes}" \
              --arg recommendation_service "${changed_services[recommendation-service]+yes}" \
              --arg shopping_service "${changed_services[shopping-service]+yes}" \
              --arg analytics_service "${changed_services[analytics-service]+yes}" \
              '[
                (select($apigateway != "") | {"service":"apigateway","path":"apigateway"}),
                (select($user_service != "") | {"service":"user-service","path":"user-service"}),
                (select($map_service != "") | {"service":"map-service","path":"map-service"}),
                (select($recommendation_service != "") | {"service":"recommendation-service","path":"recommendation-service"}),
                (select($shopping_service != "") | {"service":"shopping-service","path":"shopping-service"}),
                (select($analytics_service != "") | {"service":"analytics-service","path":"analytics-service"})
              ]')"

            deploy_services="$(jq -cn \
              --arg apigateway "${changed_services[apigateway]+yes}" \
              --arg user_service "${changed_services[user-service]+yes}" \
              --arg map_service "${changed_services[map-service]+yes}" \
              --arg recommendation_service "${changed_services[recommendation-service]+yes}" \
              --arg shopping_service "${changed_services[shopping-service]+yes}" \
              --arg analytics_service "${changed_services[analytics-service]+yes}" \
              '[
                (select($apigateway != "") | {"service":"apigateway","path":"apigateway","ecr_repository":"findy-apigateway-ecr"}),
                (select($user_service != "") | {"service":"user-service","path":"user-service","ecr_repository":"findy-user-service-ecr"}),
                (select($map_service != "") | {"service":"map-service","path":"map-service","ecr_repository":"findy-map-service-ecr"}),
                (select($recommendation_service != "") | {"service":"recommendation-service","path":"recommendation-service","ecr_repository":"findy-recommendation-service-ecr"}),
                (select($shopping_service != "") | {"service":"shopping-service","path":"shopping-service","ecr_repository":"findy-shopping-service-ecr"}),
                (select($analytics_service != "") | {"service":"analytics-service","path":"analytics-service","ecr_repository":"findy-analytics-service-ecr"})
              ]')"
          fi

          echo "test_services=${test_services}" >> "${GITHUB_OUTPUT}"
          echo "deploy_services=${deploy_services}" >> "${GITHUB_OUTPUT}"
          echo "Changed test services: ${test_services}"
          echo "Changed deploy services: ${deploy_services}"

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changed-services
    if: ${{ needs.detect-changed-services.outputs.test_services != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changed-services.outputs.test_services) }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: findy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d findy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: findy
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_KEY: ci-test-jwt-secret-key-for-findy-backend
      OPENAI_API_KEY: ci-test-openai-key

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - detect-changed-services
      - test
    if: ${{ needs.detect-changed-services.outputs.deploy_services != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changed-services.outputs.deploy_services) }}

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.ecr_repository }}
        run: |
          docker build \
            --tag "${IMAGE_URI}:${IMAGE_TAG}" \
            --tag "${IMAGE_URI}:latest" \
            "${{ matrix.path }}"
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

  update-infra:
    name: Update infra image tags
    runs-on: ubuntu-latest
    needs:
      - detect-changed-services
      - build-and-push
    if: ${{ needs.detect-changed-services.outputs.deploy_services != '[]' }}

    steps:
      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: ${{ env.INFRA_BRANCH }}
          token: ${{ secrets.PAT }}
          path: infra

      - name: Update Kubernetes manifests
        working-directory: infra
        env:
          DEPLOY_SERVICES: ${{ needs.detect-changed-services.outputs.deploy_services }}
        run: |
          set -euo pipefail

          update_image() {
            local service="$1"
            local ecr_repository="$2"
            local image="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ecr_repository}:${IMAGE_TAG}"
            local file="k8s/${service}/deployment.yaml"

            sed -i -E "s|image: .*${ecr_repository}:.*|image: ${image}|" "${file}"
          }

          echo "${DEPLOY_SERVICES}" | jq -c '.[]' | while read -r service; do
            name="$(echo "${service}" | jq -r '.service')"
            ecr_repository="$(echo "${service}" | jq -r '.ecr_repository')"
            update_image "${name}" "${ecr_repository}"
          done

      - name: Commit and push infra changes
        working-directory: infra
        run: |
          if git diff --quiet; then
            echo "No infra image tag changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/*/deployment.yaml
          git commit -m "chore: update backend images to ${IMAGE_TAG}"
          git push origin "${INFRA_BRANCH}"
