name: Backend CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  detect-changed-services:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed backend services
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_SHA="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"

            if [[ "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 "${HEAD_SHA}")"
            fi
          fi

          mapfile -t changed_files < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")

          all_services="$(jq -cn '[
            {"service":"user-service","path":"user-service"},
            {"service":"map-service","path":"map-service"},
            {"service":"recommendation-service","path":"recommendation-service"},
            {"service":"shopping-service","path":"shopping-service"}
          ]')"

          run_all=false
          declare -A changed_services=()

          for file in "${changed_files[@]}"; do
            case "${file}" in
              .github/workflows/backend-ci.yml|docker-compose.yml)
                run_all=true
                ;;
              user-service/*)
                changed_services["user-service"]=1
                ;;
              map-service/*)
                changed_services["map-service"]=1
                ;;
              recommendation-service/*)
                changed_services["recommendation-service"]=1
                ;;
              shopping-service/*)
                changed_services["shopping-service"]=1
                ;;
            esac
          done

          if [[ "${run_all}" == "true" ]]; then
            services="${all_services}"
          else
            services="$(jq -cn \
              --arg user_service "${changed_services[user-service]+yes}" \
              --arg map_service "${changed_services[map-service]+yes}" \
              --arg recommendation_service "${changed_services[recommendation-service]+yes}" \
              --arg shopping_service "${changed_services[shopping-service]+yes}" \
              '[
                (select($user_service != "") | {"service":"user-service","path":"user-service"}),
                (select($map_service != "") | {"service":"map-service","path":"map-service"}),
                (select($recommendation_service != "") | {"service":"recommendation-service","path":"recommendation-service"}),
                (select($shopping_service != "") | {"service":"shopping-service","path":"shopping-service"})
              ]')"
          fi

          echo "services=${services}" >> "${GITHUB_OUTPUT}"
          echo "Changed services: ${services}"

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changed-services
    if: ${{ needs.detect-changed-services.outputs.services != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changed-services.outputs.services) }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: findy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d findy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: findy
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_KEY: ci-test-jwt-secret-key-for-findy-backend
      OPENAI_API_KEY: ci-test-openai-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon
